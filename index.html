<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Browsers fall through to the next icon if the first is missing. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start2Code — learn to code</title>
    <meta name="description" content="Learn to code with Scratch blocks and Python, and keep your projects safe in one place." />
    <meta name="theme-color" content="#15806e" />
    <!--
      The typefaces are served from this domain, not from a font service.
      Loading a font from fonts.gstatic.com hands every visitor's IP address to
      a third party before they have clicked anything, and the people looking at
      this site are children.

      Run "npm run fonts" to fetch them into public/fonts. Until that has been
      run the file below is simply missing, the browser shrugs, and the system
      typeface in the stack takes over — nothing breaks.
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      /*
       * Recover from a stale cached page after a deploy.
       *
       * Vite gives each build a fingerprinted bundle name. A tab that was open
       * across a deploy still holds the previous index.html, so it asks for a
       * bundle that no longer exists and the app never starts — either a 404,
       * or "Unexpected token '<'" if the server answered with HTML.
       *
       * Reload once to pick up the current index.html. The flag is cleared only
       * when the app actually boots (see src/main.jsx), so a genuinely broken
       * build fails visibly instead of reloading for ever.
       */
      (function () {
        var KEY = 's2c:recovering';

        function recover(why) {
          if (sessionStorage.getItem(KEY)) return;   // already tried once
          sessionStorage.setItem(KEY, why);
          location.reload();
        }

        // A script or stylesheet that failed to load (capture phase — resource
        // errors do not bubble).
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
            recover('asset');
            return;
          }
          // HTML served in place of JavaScript surfaces as a parse error.
          if (event.message && event.message.indexOf("Unexpected token '<'") !== -1) {
            recover('html-for-js');
          }
        }, true);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
